<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fonte do assets/og.png — 1200×630</title>
  <style>
    /* Fonte de origem do assets/og.png. Renderizar em 1200×630 e salvar por
       cima do arquivo; ver a receita no fim deste arquivo. */
    @font-face {
      font-family: 'Archivo';
      font-style: normal;
      font-weight: 700 800;
      src: url('../assets/fonts/archivo-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 100 900;
      src: url('../assets/fonts/geist-latin-variable.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 500;
      src: url('../assets/fonts/jetbrains-mono-latin.woff2') format('woff2');
    }

    /* Caderno Noturno — os mesmos valores de assets/css/style.css */
    :root {
      --ink: #080c17;
      --night: #0a0e1a;
      --panel: #0f1729;
      --bone: #eef2f8;
      --dim: #93a1bc;
      --signal: #ffd43b;
      --on-signal: #1b1500;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: #1d2a4a; }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--ink);
      color: var(--bone);
      font-family: Geist, system-ui, sans-serif;
    }

    #dust { position: absolute; inset: 0; }

    .name {
      position: absolute;
      font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 168px;
      line-height: .84;
      letter-spacing: -.045em;
    }
    .name--first { left: 38px; top: 62px; }
    .name--last  { right: 38px; bottom: 66px; }

    .meta {
      position: absolute;
      font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.9;
      color: var(--dim);
      display: flex;
      flex-direction: column;
    }
    .meta--place { right: 40px; top: 78px; text-align: right; }
    .meta--role  { left: 40px; bottom: 86px; }

    .talk {
      position: absolute;
      right: 40px;
      top: 226px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .bubble {
      border-radius: 12px;
      padding: 15px 19px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.55;
      white-space: pre-line;
    }
    .bubble--ask {
      position: relative;
      background: var(--signal);
      color: var(--on-signal);
      font-weight: 600;
      margin-right: 22px;
    }
    /* rabicho apontando para o cartão de baixo */
    .bubble--ask::after {
      content: "";
      position: absolute;
      right: 26px;
      bottom: -8px;
      width: 16px;
      height: 16px;
      background: var(--signal);
      transform: rotate(45deg);
      border-radius: 3px;
    }
    .bubble--card {
      background: var(--panel);
      border: 1px solid #1d2a4a;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 22px 14px 14px;
    }

    .seal {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--night);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <canvas id="dust" width="1200" height="630"></canvas>

    <div class="name name--first">Toni</div>
    <div class="name name--last">Coimbra</div>

    <div class="meta meta--place">
      <span>TJPR — Assessoria STF/STJ</span>
      <!-- Herdado do cartão anterior. É um horário congelado em imagem
           estática: some dia vai parecer errado. Vale considerar tirar. -->
      <span>14:54:46 BRT</span>
      <span>Curitiba, PR</span>
    </div>

    <div class="meta meta--role">
      <span>IA &amp; Automação</span>
      <span>Desenvolvedor Python</span>
      <span>Professor — SEED-PR</span>
    </div>

    <div class="talk">
      <div class="bubble bubble--ask">Olá — tem um projeto?
Vamos conversar.</div>
      <div class="bubble bubble--card">
        <span class="seal">
          <!-- O selo: monograma TC sobre o campo noturno, T papel e C amarelo
               (os caminhos de assets/logo.svg). -->
          <svg viewBox="0 0 403.93 226.77" width="40" height="23" role="img" aria-label="Toni Coimbra">
            <path fill="#f1f0ec" d="M70.87 0.00L127.56 0.00L226.77 0.00L226.77 0.08C201.18 16.55 181.53 41.46 171.75 70.87L127.56 70.87L127.56 226.77L70.87 226.77L70.87 70.87L0.00 70.87L0.00 0.00L70.87 0.00Z"></path>
            <path fill="#ffd43b" d="M299.54 170.08L403.93 170.08L403.93 226.77L299.54 226.77C268.23 226.77 239.88 214.08 219.36 193.56C198.84 173.04 186.15 144.69 186.15 113.39C186.15 82.08 198.84 53.73 219.36 33.21C239.88 12.69 268.23 0.00 299.54 0.00L403.93 0.00L403.93 56.69L299.54 56.69C283.88 56.69 269.71 63.04 259.45 73.30C249.19 83.55 242.84 97.73 242.84 113.39C242.84 129.04 249.19 143.22 259.45 153.48C269.71 163.73 283.88 170.08 299.54 170.08Z"></path>
          </svg>
        </span>
        <span>Fale comigo,
não com um formulário</span>
      </div>
    </div>
  </div>

  <script>
    /* Poeira determinística: mesma semente, mesma imagem em toda regeração. */
    (function () {
      const ctx = document.getElementById('dust').getContext('2d');
      let seed = 20260908;
      const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

      for (let i = 0; i < 220; i++) {
        const x = rnd() * 1200;
        /* concentra na faixa de baixo, como no cartão original */
        const y = 630 - Math.pow(rnd(), 2.6) * 300;
        const r = 0.6 + rnd() * 1.1;
        ctx.fillStyle = 'rgba(238, 242, 248, ' + (0.04 + rnd() * 0.17).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      document.documentElement.dataset.dust = 'done';
    })();
  </script>

  <!--
    Para regerar assets/og.png a partir deste arquivo:

    node -e "const {chromium}=require('@playwright/test');const {pathToFileURL}=require('url');
    (async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:1200,height:630}});
    await p.goto(pathToFileURL('design-system/og-card.html').href);await p.waitForTimeout(600);
    await p.locator('.card').screenshot({path:'assets/og.png'});await b.close();})()"
  -->
</body>
</html>
