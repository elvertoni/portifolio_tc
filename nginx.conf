worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  etag on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Página única: um endereço que não existe é 404 de verdade, não a home
    # com 200 — senão /sitemap.xml ou /favicon.ico respondem HTML.
    error_page 404 /404.html;

    # Nada que comece com ponto (.git, .auditoria, .impeccable…) é público;
    # só /.well-known/ passa, para validação de certificado.
    location ~ /\.(?!well-known/) {
      return 404;
    }

    location = / {
      try_files /index.html =404;
      add_header Cache-Control "no-cache, must-revalidate" always;
      # A página não carrega nada de fora além do envio do formulário; a CSP
      # diz isso ao navegador. O JSON-LD é bloco de dados, não script: passa.
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://api.web3forms.com; form-action https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
      # A página não carrega nada de fora além do envio do formulário; a CSP
      # diz isso ao navegador. O JSON-LD é bloco de dados, não script: passa.
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://api.web3forms.com; form-action https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # CSS, JS e SVG estão acoplados ao index.html: uma versão nova do HTML com
    # uma versão velha destes arquivos quebra a página inteira. Como o index.html
    # é no-cache, estes também precisam revalidar a cada visita. O ETag faz a
    # revalidação custar um 304, não o arquivo inteiro.
    # Regex tem precedência sobre o prefixo /assets/ abaixo.
    location ~* ^/assets/.+\.(?:css|js|svg)$ {
      try_files $uri =404;
      add_header Cache-Control "no-cache, must-revalidate" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Fontes são imutáveis para o nome que têm: trocar a fonte troca o arquivo.
    location ~* ^/assets/.+\.woff2$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Imagens: um dia. Elas mudam pouco, mas mudam — sete dias deixa uma captura
    # trocada fora do ar por tempo demais.
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location / {
      try_files $uri $uri/ =404;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
  }
}
